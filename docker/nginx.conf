server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Comprime css/js/html antes de enviarlos al navegador, para que
    # la app cargue más rápido sin tener que cambiar nada del código.
    gzip on;
    gzip_types text/css application/javascript text/html;

    # Los archivos CSS y JS casi no cambian entre despliegues, así que
    # le decimos al navegador que los guarde en caché 7 días en vez de
    # pedirlos de nuevo cada vez que se recarga la página.
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Endpoint simple para que el HEALTHCHECK del Dockerfile (y más
    # adelante docker-compose) puedan confirmar que el contenedor
    # está realmente sirviendo tráfico, no solo que el proceso existe.
    location /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}