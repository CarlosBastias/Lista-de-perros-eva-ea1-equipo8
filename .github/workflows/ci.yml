name: CI

# Se ejecuta con cada push a develop y con cada Pull Request hacia
# develop o main. Agregamos "pull_request hacia develop" (antes solo
# apuntaba a main) para que las pruebas corran ANTES de fusionar una
# feature/hotfix, no solo después de llegar a main.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  validar-proyecto:
    name: Validar estructura y sintaxis
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verificar que existan los archivos base
        run: |
          test -f src/index.html
          test -f src/index.js
          test -f src/perroLogica.js
          test -f src/style.css
          echo "✅ Estructura de archivos correcta"

      - name: Verificar sintaxis de JavaScript
        run: |
          node --check src/index.js
          node --check src/perroLogica.js

      - name: Verificar HTML con htmlhint
        run: npx --yes htmlhint src/index.html

  # IE2: pruebas unitarias con Jest sobre la lógica pura de la app
  # (src/perroLogica.js). Si una prueba falla, el PR queda bloqueado.
  pruebas-unitarias:
    name: Pruebas unitarias (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Correr pruebas con Jest
        run: npm test

  # IE1: construye la imagen Docker para confirmar que el Dockerfile
  # sigue siendo válido con cada cambio. Solo se ejecuta si lo
  # anterior pasó, para no gastar tiempo de pipeline construyendo
  # una imagen de código que ni siquiera compila/pasa pruebas.
  build-imagen-docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: [validar-proyecto, pruebas-unitarias]

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -f docker/Dockerfile -t lista-de-perros:${{ github.sha }} .

  # ------------------------------------------------------------------
  # A partir de acá van los jobs de la otra mitad del equipo (IE3,
  # IE4, IE5): análisis de dependencias/Dependabot, SonarCloud/Snyk,
  # despliegue a Docker Compose y orquestación. Se agregan como jobs
  # nuevos en este mismo archivo (o workflows aparte si se prefiere
  # separar "ci" de "cd"), sin tocar los tres de arriba.
  # ------------------------------------------------------------------